apiVersion: v1
kind: Service
metadata:
  name: matomo-mariadb
  labels:
    app: matomo-mariadb
spec:
  selector:
    app: matomo-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matomo-mariadb
  labels:
    app: matomo-mariadb
spec:
  serviceName: matomo-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: matomo-mariadb
  template:
    metadata:
      labels:
        app: matomo-mariadb
    spec:
      containers:
        - name: mariadb
          # the matomo-mariadb Secret is provisioned separately (see openshift/secrets/), not by kustomize
          image: docker.io/bitnami/mariadb:11.4
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: matomo-mariadb
                  key: database-name
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: matomo-mariadb
                  key: database-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matomo-mariadb
                  key: database-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matomo-mariadb
                  key: database-root-password
          volumeMounts:
            - name: data
              mountPath: /bitnami/mariadb
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-u", "root", "-p$(MARIADB_ROOT_PASSWORD)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-u", "root", "-p$(MARIADB_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
