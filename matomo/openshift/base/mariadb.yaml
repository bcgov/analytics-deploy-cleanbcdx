apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matomo-mariadb
  labels:
    app: matomo-mariadb
spec:
  accessModes: 
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matomo-mariadb
  labels:
    app: matomo-mariadb
spec:
  replicas: 1
  strategy:
    # avoids two pods ever mounting the ReadWriteOnce PVC at once during a rollout
    type: Recreate
  selector:
    matchLabels:
      app: matomo-mariadb
  template:
    metadata:
      labels:
        app: matomo-mariadb
    spec:
      containers:
        - name: mariadb
          # the matomo-mariadb Secret is provisioned separately (see openshift/secrets/), not by kustomize
          # bitnami no longer publishes free versioned tags (e.g. 11.4), only a rolling "latest"
          image: docker.io/bitnami/mariadb:latest
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: matomo-mariadb
                  key: database-name
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: matomo-mariadb
                  key: database-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matomo-mariadb
                  key: database-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matomo-mariadb
                  key: database-root-password
          volumeMounts:
            - name: data
              mountPath: /bitnami/mariadb
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-u", "root", "-p$(MARIADB_ROOT_PASSWORD)"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-u", "root", "-p$(MARIADB_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matomo-mariadb
---
apiVersion: v1
kind: Service
metadata:
  name: matomo-mariadb
  labels:
    app: matomo-mariadb
spec:
  selector:
    app: matomo-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
