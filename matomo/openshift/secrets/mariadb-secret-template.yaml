apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: matomo-mariadb-secret
  annotations:
    description: >-
      One-time generator for the matomo-mariadb Secret (random DB credentials).
      Deliberately kept out of the kustomize base/overlays: re-applying it would generate
      new random passwords that no longer match the already-provisioned MariaDB, so only
      run this once per environment before the first `oc apply -k`.
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}
      labels:
        app: ${NAME}
    stringData:
      database-name: ${DATABASE_NAME}
      database-user: ${DATABASE_USER}
      database-password: ${DATABASE_PASSWORD}
      database-root-password: ${DATABASE_ROOT_PASSWORD}
parameters:
  - name: NAME
    value: matomo-mariadb
  - name: DATABASE_NAME
    value: matomo
  - name: DATABASE_USER
    value: matomo
  - name: DATABASE_PASSWORD
    generate: expression
    from: "[a-zA-Z0-9]{16}"
  - name: DATABASE_ROOT_PASSWORD
    generate: expression
    from: "[a-zA-Z0-9]{16}"
